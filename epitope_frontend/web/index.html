<!DOCTYPE html>
<html>

<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project.">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="epitope_frontend">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Primary font and icon fallbacks from CDN -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Force CanvasKit renderer for consistent icon rendering -->
    <script>
        window.flutterWebRenderer = "canvaskit";
    </script>
    <meta name="flutter-web-renderer" content="canvaskit">

    <style>
        /* Force Material Icons to use the CDN font even if Flutter's local one fails */
        .material-icons {
            font-family: 'Material Icons' !important;
        }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>epitope_frontend</title>
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <script src="flutter_bootstrap.js" async></script>
</body>

</html>
