server {
    listen       ${PORT};
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 1. Entry points - Always revalidate with the server
    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 2. Service Worker and Bootstrap
    location ~* (?:flutter_service_worker\.js|flutter_bootstrap\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 3. Static Assets
    location ~* \.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Type application/javascript;
        expires 0;
    }

    location ~* \.css$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Type text/css;
        expires 0;
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
        expires 30d;
    }

    # Fonts: DISABLE GZIP and ensure correct types
    location ~* \.(?:woff|woff2|ttf|otf)$ {
        gzip off;
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
        expires 30d;
    }

    location / {
        # This line is crucial for Flutter web routing
        try_files $uri $uri/ /index.html;
    }

    # Ensure 404 for missing assets instead of serving index.html
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|json)$ {
        try_files $uri =404;
    }

    # Optional: Enable Gzip compression (excluding fonts)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
