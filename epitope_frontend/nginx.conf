server {
    listen       ${PORT};
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 1. Entry points - Always revalidate with the server
    # no-cache means the browser can store the file but MUST check with the server (using ETag) before using it.
    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 2. Service Worker and Bootstrap - Always revalidate to ensure updates are detected
    location ~* (?:flutter_service_worker\.js|flutter_bootstrap\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 3. Static Assets - Can be cached for performance
    # JS and CSS are set to no-cache as well to be safe, unless they are guaranteed to have unique hashes.
    # Images and fonts are cached long-term.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Type application/javascript;
        expires 0;
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
        expires 30d;
    }

    location ~* \.(?:woff|woff2|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
        # Force correct types for fonts
        types {
            font/opentype otf;
            font/truetype ttf;
            font/woff woff;
            font/woff2 woff2;
        }
        expires 30d;
    }

    location / {
        # Only serve index.html for navigation routes, not for missing assets
        try_files $uri $uri/ /index.html;
    }

    # Ensure 404 for missing assets instead of serving index.html
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|json)$ {
        try_files $uri =404;
    }

    # Optional: Enable Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
