server {
    listen       ${PORT};
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Explicitly declare font MIME types that nginx:stable-alpine omits or maps wrong.
    # Without this, MaterialIcons-Regular.otf is served as application/octet-stream
    # and browsers refuse to load it as a font, causing all Material Icons to vanish.
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/javascript                       js mjs;
        application/json                      json;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/svg+xml                         svg svgz;
        image/x-icon                          ico;
        image/webp                            webp;
        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        font/otf                              otf;
        application/vnd.ms-fontobject         eot;
    }

    # 1. Entry points - Always revalidate with the server
    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 2. Service Worker and Bootstrap
    location ~* (?:flutter_service_worker\.js|flutter_bootstrap\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 3. Static Assets — fonts need Access-Control-Allow-Origin for cross-origin loading
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
        expires 30d;
    }

    location / {
        # This line is crucial for Flutter web routing
        try_files $uri $uri/ /index.html;
    }

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype font/otf font/woff font/woff2 image/svg+xml image/x-icon;
}
